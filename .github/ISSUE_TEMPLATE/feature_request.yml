name: Feature request
description: Suggest an idea or improvement for LoreGraph.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape LoreGraph. Please keep in mind that the project is a
        **local-first, no-account, no-backend** tool for v0.1, and large features
        (timeline, map, image attachments, AI, cloud sync, collaboration, plugins) are
        intentionally out of scope for this release.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the workflow that is currently painful.
      placeholder: When I write a long description for a character, I cannot ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like to see. Sketches or examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have thought about.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Which area does this affect?
      multiple: true
      options:
        - Graph canvas and edges
        - Node and property editing
        - Search and filtering
        - Universe management
        - Import and export
        - Theme and accessibility
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
